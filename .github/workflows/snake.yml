name: contribution snake

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/snake.yml
      - scripts/snake-panel.js

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake (svg only)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # README palette: cream snake, dots stepping from panel black to the tan accent #D4A866
          outputs: |
            dist/github-snake.svg?color_snake=#F2EBDC&color_dots=#1A1A18,#3B3324,#6A5636,#9E7F4E,#D4A866

      - name: Put it on the dark panel
        run: node scripts/snake-panel.js dist/github-snake.svg

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
