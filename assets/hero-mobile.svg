@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.drift1{animation:drift1 12s cubic-bezier(.45,0,.55,1) infinite alternate}
.drift2{animation:drift2 10s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes drift1{from{transform:translate(0,0)}to{transform:translate(-80px,40px)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(70px,-30px)}}
.grain{animation:grain 8s cubic-bezier(.45,0,.55,1) infinite alternate}
