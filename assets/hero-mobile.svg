<svg xmlns="http://www.w3.org/2000/svg" width="400" height="443" fill="none" aria-labelledby="t" role="img" viewBox="0 0 400 443"><title id="t">TIMI. Developer, onchain builder. Payments, DeFi, security, bots.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,&apos;Noto Sans&apos;,Helvetica,Arial,sans-serif;fill:#F2EBDC}
.m{font-family:ui-monospace,SFMono-Regular,&apos;SF Mono&apos;,Menlo,Consolas,&apos;Liberation Mono&apos;,monospace}
