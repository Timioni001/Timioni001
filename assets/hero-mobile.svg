.k1{animation:k1 12s 4s infinite both}
@keyframes k1{0%{transform:translateX(-171.6px);animation-timing-function:steps(22,end)}16%,100%{transform:translateX(0)}}
.g2{animation:g2 12s linear 8s infinite both}
