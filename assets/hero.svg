.cur{animation:blink 1.2s cubic-bezier(.45,0,.55,1) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.slash{animation:slash 8s cubic-bezier(.45,0,.55,1) infinite}
