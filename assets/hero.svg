<svg xmlns="http://www.w3.org/2000/svg" width="880" height="662" fill="none" aria-labelledby="t" role="img" viewBox="0 0 880 662"><title id="t">TIMI. Developer, onchain builder. Payments, DeFi, security, bots.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,&apos;Noto Sans&apos;,Helvetica,Arial,sans-serif;fill:#F2EBDC}
