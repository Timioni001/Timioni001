<svg xmlns="http://www.w3.org/2000/svg" width="880" height="385" fill="none" aria-labelledby="t" role="img" viewBox="0 0 880 385"><title id="t">About: I build onchain products where money moves: streaming payments, trading bots, and perps for tokenized stocks. I also hunt web and API bugs. Focus: payments, DeFi, security, bots, AI agents, tokenized equities, privacy.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,&apos;Noto Sans&apos;,Helvetica,Arial,sans-serif;fill:#F2EBDC}
