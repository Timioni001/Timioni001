<svg xmlns="http://www.w3.org/2000/svg" width="400" height="442" fill="none" aria-labelledby="t" role="img" viewBox="0 0 400 442"><title id="t">About: I build onchain products where money moves: streaming payments, trading bots, and perps for tokenized stocks. I also hunt web and API bugs. Focus: payments, DeFi, security, bots, AI agents, tokenized equities, privacy.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,&apos;Noto Sans&apos;,Helvetica,Arial,sans-serif;fill:#F2EBDC}
